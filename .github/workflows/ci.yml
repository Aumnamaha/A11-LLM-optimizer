name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Block model weights and large files
        run: |
          if git ls-files | grep -E "\.(gguf|ggml|safetensors|bin|pt|pth|ckpt|onnx)$"; then
            echo "Model files are tracked"; exit 1
          fi
          if git ls-files -z | xargs -0 du -b | awk "\$1 > 5242880" | grep .; then
            echo "File over 5 MB"; exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy .

      - name: Test
        run: pytest -q
