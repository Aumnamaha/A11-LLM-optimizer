name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block model weights and large files
        run: |
          if git ls-files | grep -E "\.(gguf|ggml|safetensors|bin|pt|pth|ckpt|onnx)$"; then
            echo "Model files are tracked"; exit 1
          fi
          if git ls-files -z | xargs -0 du -b | awk "\$1 > 5242880" | grep .; then
            echo "File over 5 MB"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi
