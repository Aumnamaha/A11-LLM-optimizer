name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Block model weights and large files
        run: |
          if git ls-files | grep -E "\.(gguf|ggml|safetensors|bin|pt|pth|ckpt|onnx)$"; then
            echo "Model files are tracked"; exit 1
          fi
          if git ls-files -z | xargs -0 du -b | awk "\$1 > 5242880" | grep .; then
            echo "File over 5 MB"; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy .
