# Tooling configuration for A11-LLM-Optimizer.
#
# The native extension is still built through setup.py
# (`python setup.py build_ext --inplace`), which needs torch at build time.

[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.2"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Ruff (linter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", ".venv", "models"]

# Blocking lint gate: only high-signal, bug-catching rules so the existing
# codebase stays green. Run `ruff check --select ALL` for the full audit.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
